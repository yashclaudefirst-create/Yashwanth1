<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Leaf Gradients -->
    <linearGradient id="gOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="20%" stop-color="#e6be53"/>
      <stop offset="40%" stop-color="#997015"/>
      <stop offset="60%" stop-color="#fceaa1"/>
      <stop offset="80%" stop-color="#c4951b"/>
      <stop offset="100%" stop-color="#422e02"/>
    </linearGradient>

    <linearGradient id="gBevel" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c4004"/>
      <stop offset="25%" stop-color="#f7d774"/>
      <stop offset="50%" stop-color="#8a600a"/>
      <stop offset="75%" stop-color="#fff3b3"/>
      <stop offset="100%" stop-color="#2a1a00"/>
    </linearGradient>

    <linearGradient id="gInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="50%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#3d2800"/>
    </linearGradient>

    <filter id="frameShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g filter="url(#frameShadow)">
    <!-- Main Outer Molded Baroque Frame (Cutout Window: 32,32 to 468,618) -->
    <path d="M 0,0 L 500,0 L 500,650 L 0,650 Z M 32,32 L 32,618 L 468,618 L 468,32 Z" fill="url(#gOuter)" fill-rule="evenodd"/>

    <!-- Sculpted Inner Relief Moulding -->
    <path d="M 10,10 L 490,10 L 490,640 L 10,640 Z M 26,26 L 26,624 L 474,624 L 474,26 Z" fill="url(#gBevel)" fill-rule="evenodd" opacity="0.95"/>
    <path d="M 18,18 L 482,18 L 482,632 L 18,632 Z M 32,32 L 32,618 L 468,618 L 468,32 Z" fill="url(#gInner)" fill-rule="evenodd"/>

    <!-- Sight Edge Gold Trim Lines -->
    <rect x="32" y="32" width="436" height="586" fill="none" stroke="#261700" stroke-width="3"/>
    <rect x="34" y="34" width="432" height="582" fill="none" stroke="#ffe89c" stroke-width="1.5"/>

    <!-- Outer Edge Fine Gold Bead -->
    <rect x="2" y="2" width="496" height="646" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.85"/>

    <!-- Ornate Corner Scrollwork / Shell Ornaments (Kept inside the frame border 0..32px) -->
    <!-- Top-Left Corner -->
    <g transform="translate(0,0)">
      <path d="M 2,2 C 16,2 28,14 28,28 C 18,28 8,20 2,2 Z" fill="url(#gOuter)"/>
      <circle cx="16" cy="16" r="5" fill="url(#gInner)" stroke="#261700" stroke-width="1"/>
      <circle cx="16" cy="16" r="2" fill="#fff5c0"/>
    </g>

    <!-- Top-Right Corner -->
    <g transform="translate(500,0) scale(-1,1)">
      <path d="M 2,2 C 16,2 28,14 28,28 C 18,28 8,20 2,2 Z" fill="url(#gOuter)"/>
      <circle cx="16" cy="16" r="5" fill="url(#gInner)" stroke="#261700" stroke-width="1"/>
      <circle cx="16" cy="16" r="2" fill="#fff5c0"/>
    </g>

    <!-- Bottom-Left Corner -->
    <g transform="translate(0,650) scale(1,-1)">
      <path d="M 2,2 C 16,2 28,14 28,28 C 18,28 8,20 2,2 Z" fill="url(#gOuter)"/>
      <circle cx="16" cy="16" r="5" fill="url(#gInner)" stroke="#261700" stroke-width="1"/>
      <circle cx="16" cy="16" r="2" fill="#fff5c0"/>
    </g>

    <!-- Bottom-Right Corner -->
    <g transform="translate(500,650) scale(-1,-1)">
      <path d="M 2,2 C 16,2 28,14 28,28 C 18,28 8,20 2,2 Z" fill="url(#gOuter)"/>
      <circle cx="16" cy="16" r="5" fill="url(#gInner)" stroke="#261700" stroke-width="1"/>
      <circle cx="16" cy="16" r="2" fill="#fff5c0"/>
    </g>

    <!-- Center Crest Cartouches (Top and Bottom) -->
    <path d="M 230,0 C 240,12 250,16 250,22 C 250,16 260,12 270,0 Z" fill="url(#gOuter)"/>
    <circle cx="250" cy="10" r="3.5" fill="url(#gInner)" stroke="#261700" stroke-width="0.8"/>

    <path d="M 230,650 C 240,638 250,634 250,628 C 250,634 260,638 270,650 Z" fill="url(#gOuter)"/>
    <circle cx="250" cy="640" r="3.5" fill="url(#gInner)" stroke="#261700" stroke-width="0.8"/>
  </g>
</svg>
